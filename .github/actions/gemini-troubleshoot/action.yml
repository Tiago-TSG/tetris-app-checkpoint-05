name: 'Gemini AI Troubleshooting'
description: 'Diagnostica falhas no pipeline em tempo real utilizando a inteligência artificial do Google Gemini.'
runs:
  using: "composite"
  steps:
    - name: Fetch Failed Job Logs
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "=== FAILED WORKFLOW LOGS ===" > failed_logs.txt
        gh run view ${{ github.run_id }} --log-failed >> failed_logs.txt || true
        tail -n 100 failed_logs.txt # Mantém um snapshot no console do runner

    - name: Ask Gemini to Diagnose Failure
      shell: bash
      run: |
        python3 -c '
        import json, os, urllib.request

        api_key = os.environ.get("GEMINI_API_KEY", "").strip()
        if not api_key:
            with open("gemini_response.md", "w") as f:
                f.write("### 🚨 Erro no Troubleshooting\nA chave de API `GEMINI_API_KEY` não está configurada nos segredos do repositório.")
            exit(0)

        try:
            with open("failed_logs.txt", "r") as f:
                logs = f.read()
        except Exception:
            logs = ""

        # FALLBACK INTELIGENTE: Se os logs vierem vazios (limitação do GitHub Actions para jobs em andamento),
        # nós alimentamos a IA com os arquivos relevantes do próprio workspace com base no Job que falhou!
        job_id = os.environ.get("GITHUB_JOB", "")
        workspace_context = ""
        
        if not logs.strip() or logs.strip() == "=== FAILED WORKFLOW LOGS ===":
            logs = "Os logs de execução do Actions estão temporariamente vazios (limitação da API do GitHub para jobs ainda ativos)."
            
            if job_id == "test":
                try:
                    with open("backend/test_main.py", "r") as f:
                        test_content = f.read()
                    workspace_context = f"\n\nNo entanto, como o job que falhou é de Testes Unitários (test), aqui está o código de testes do arquivo '\''backend/test_main.py'\'' para você analisar se há asserções falhas ou bugs induzidos:\n\n```python\n{test_content}\n```"
                except Exception as e:
                    workspace_context = f"\nNão foi possível ler o arquivo de teste: {str(e)}"
            elif job_id == "lint":
                workspace_context = "\nDica: O erro ocorreu na etapa de LINT (Qualidade de Código). Verifique se há arquivos com erro de sintaxe, variáveis não declaradas ou formatação fora do padrão PEP8 no Python ou Flat Config no Javascript."
            elif job_id == "sast":
                workspace_context = "\nDica: O erro ocorreu na etapa de SAST (Segurança). Verifique se o Bandit ou Trivy detectaram alguma vulnerabilidade crítica nas dependências (backend/requirements.txt) ou se o Gitleaks encontrou segredos expostos no histórico do Git."

        prompt = f"Você é o Gemini CLI, um assistente especialista DevOps. O pipeline do projeto Retro Neon Tetris falhou no Job '\''{job_id}'\''. Analise as informações de erro fornecidas abaixo e responda em português com um relatório estruturado em markdown contendo uma explicação curta e direta do motivo da falha, além de sugestões de correção passo a passo.\n\nLOGS DE ERRO:\n{logs}{workspace_context}"

        payload = {
            "contents": [{
                "parts": [{
                    "text": prompt
                }]
            }]
        }

        urls = [
            f"https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key={api_key}",
            f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}",
            f"https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key={api_key}",
            f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key={api_key}"
        ]

        success = False
        errors = []
        for url in urls:
            req = urllib.request.Request(
                url,
                data=json.dumps(payload).encode("utf-8"),
                headers={"Content-Type": "application/json"},
                method="POST"
            )
            try:
                with urllib.request.urlopen(req) as response:
                    res_data = json.loads(response.read().decode("utf-8"))
                    text = res_data["candidates"][0]["content"]["parts"][0]["text"]
                    with open("gemini_response.md", "w") as out:
                        out.write(text)
                    success = True
                    break
            except Exception as e:
                model_name = url.split("/models/")[1].split(":")[0]
                api_ver = url.split("googleapis.com/")[1].split("/")[0]
                errors.append(f"Tentativa com {model_name} ({api_ver}) falhou: {str(e)}")

        if not success:
            api_key_info = f"Tamanho: {len(api_key)}"
            if len(api_key) > 8:
                api_key_info += f" | Início: {api_key[:4]}... | Fim: ...{api_key[-4:]}"
            else:
                api_key_info += f" | Valor: {api_key}"
            error_details = "\n".join([f"* {err}" for err in errors])
            with open("gemini_response.md", "w") as out:
                out.write(f"### 🚨 Erro de Comunicação com o Gemini\nNão foi possível obter a resposta do Gemini em nenhuma das tentativas.\n\n**Detalhes das tentativas:**\n{error_details}\n\n* **Informações da Chave Utilizada:** `{api_key_info}`\n\n*Dica: Verifique se você não colou por engano o nome literal do segredo (como secrets.GEMINI_API_KEY com as chaves ou aspas) como o valor do segredo no GitHub Settings. A chave real gerada no Google AI Studio deve começar com `AIzaSy`.*")
        '

    - name: Write Troubleshooting Report to Step Summary
      shell: bash
      run: |
        echo "## 🤖 Relatório de Diagnóstico do Gemini AI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        cat gemini_response.md >> $GITHUB_STEP_SUMMARY
