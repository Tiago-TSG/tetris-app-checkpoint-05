name: DevSecOps CI/CD Pipeline - Retro Neon Tetris

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - '.github/actions/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ secrets.GCP_GAR_LOCATION }}
  REPOSITORY: ${{ secrets.GCP_GAR_REPOSITORY }}
  SERVICE: ${{ secrets.GCP_RUN_SERVICE }}
  REGION: ${{ secrets.GCP_REGION }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Chave global herdada por todos os passos e ações

permissions:
  contents: read
  id-token: write # Requerido para autenticação via WIF
  actions: read # Permitir que a CLI do GitHub busque logs para o troubleshooting com IA

jobs:
  # ==========================================
  # JOB 1: QUALIDADE E ESTILO DE CÓDIGO (LINT)
  # ==========================================
  lint:
    name: 1. Code Quality & Style (LINT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 1. Lint do Python usando Ruff (Ultrarápido)
      - name: Lint Python Code with Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./backend"
          args: "check --ignore BLE001"

      # 2. Lint do JavaScript usando ESLint (Flat Config)
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install ESLint and run check
        run: |
          npm init -y --silent
          npm install eslint@9.10.0 --save-dev --silent
          npx eslint static/js/

      # 3. Hadolint - Lint do Dockerfile
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # 4. Diagnóstico de IA do Gemini se houver falhas no LINT
      - name: 🤖 Gemini AI Troubleshooting on Failure
        if: failure()
        uses: ./.github/actions/gemini-troubleshoot

  # ==========================================
  # JOB 2: SEGURANÇA ESTÁTICA DO CÓDIGO (SAST)
  # ==========================================
  sast:
    name: 2. Static Security (SAST)
    needs: lint # Executado apenas após aprovação no Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Necessário para o Gitleaks analisar histórico de commits

      # 1. Gitleaks - Detectar segredos expostos
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Bandit - SAST de Segurança em Python (Sinaliza falhas graves)
      - name: Python Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r backend/ -ll

      # 3. Trivy FS - Análise de dependências estáticas (SCA no filesystem)
      - name: Scan repository for vulnerabilities (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # 4. Diagnóstico de IA do Gemini se houver falhas no SAST
      - name: 🤖 Gemini AI Troubleshooting on Failure
        if: failure()
        uses: ./.github/actions/gemini-troubleshoot

  # ==========================================
  # JOB 3: TESTES UNITÁRIOS (CI)
  # ==========================================
  test:
    name: 3. Unit Tests (CI)
    needs: sast # Executado apenas após o código ser validado em estilo e segurança estática
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s backend -p "test_main.py"

      # 4. Diagnóstico de IA do Gemini se houver falhas nos Testes
      - name: 🤖 Gemini AI Troubleshooting on Failure
        if: failure()
        uses: ./.github/actions/gemini-troubleshoot

  # ==========================================
  # JOB 4: GERAÇÃO DO ARTEFATO SEGURO (BUILD & SCA)
  # ==========================================
  build-and-push:
    name: 4. Secure Artifact Build (SCA)
    needs: test # Executado apenas após aprovação nos testes funcionais
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 1. Autenticação Segura via WIF
      - name: Google Auth (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # 2. Configuração do gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # 3. Autenticação do Docker no Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 4. Build da Imagem Docker Localmente
      - name: Build Container Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 5. Trivy - Varredura de Segurança da imagem Docker gerada (SCA no container)
      - name: Scan Docker Image (Trivy Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 6. Push da Imagem caso passe em todos os testes de segurança do container
      - name: Push Container Image
        run: |
          docker push ${{ env.IMAGE_TAG }}

      # 7. Diagnóstico de IA do Gemini se houver falhas no Build/SCA
      - name: 🤖 Gemini AI Troubleshooting on Failure
        if: failure()
        uses: ./.github/actions/gemini-troubleshoot

  # ==========================================
  # JOB 5: ORQUESTRAÇÃO DE AMBIENTE (DEPLOY)
  # ==========================================
  deploy:
    name: 5. Continuous Deployment (CD)
    needs: build-and-push # Só executa se o artefato seguro foi publicado no GAR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 1. Autenticação Segura via WIF
      - name: Google Auth (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # 2. Configuração do gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # 3. Deploy no Google Cloud Run apontando para a imagem certificada do GAR
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: |
            --port=8080
            --allow-unauthenticated

      # 4. Deploy de Orquestradores do Google Cloud Workflows
      - name: Deploy Cloud Workflows
        run: |
          gcloud workflows deploy buy_skin_workflow \
            --source=buy_skin_workflow.yaml \
            --location=${{ env.REGION }} \
            --quiet

          gcloud workflows deploy submit_score_workflow \
            --source=submit_score_workflow.yaml \
            --location=${{ env.REGION }} \
            --quiet

      # 5. Diagnóstico de IA do Gemini se houver falhas no Deploy
      - name: 🤖 Gemini AI Troubleshooting on Failure
        if: failure()
        uses: ./.github/actions/gemini-troubleshoot
